name: implementation
version: 1
execution: reference-only
description: Implement a bounded change, verify it, and request an independent review when risk warrants it.
intent:
  main_model: auto
  delegate_count: 2
  prefer_vendor_diversity: true
  mechanical_tests: true
  independent_review: true
phases:
  - inspect
  - implement
  - mechanical-verify
  - independent-review
  - summarize
safety:
  auto_merge: false
  auto_push: false
  destructive_git: false
