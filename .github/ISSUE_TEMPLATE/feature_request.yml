name: Feature request
description: Suggest a portable orchestration improvement
title: "feat: "
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What workflow is difficult today?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed behavior
    validations:
      required: true
  - type: checkboxes
    id: platform
    attributes:
      label: Platform impact
      options:
        - label: macOS
        - label: Linux
