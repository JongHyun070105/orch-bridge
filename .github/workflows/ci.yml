name: CI

on:
  push:
    branches: [main]
  pull_request:
  repository_dispatch:
    types: [release-please-pr]

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        python: ['3.11', '3.13']
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.client_payload.ref || github.ref }}
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Install test dependencies
        run: |
          python -m pip install --disable-pip-version-check --upgrade pip
          python -m pip install --disable-pip-version-check -r requirements.txt pytest
      - name: Compile Python sources
        run: |
          python -m compileall -q app scripts tests
          python - <<'PY'
          from pathlib import Path
          for folder in ("app", "bin", "scripts", "tests"):
              for path in Path(folder).rglob("*"):
                  if not path.is_file() or path.suffix in {".pyc", ".pyo"}:
                      continue
                  source = path.read_text(encoding="utf-8")
                  if path.suffix == ".py" or source.startswith("#!/usr/bin/env python") or source.startswith("#!/usr/bin/python"):
                      compile(source, str(path), "exec")
          PY
      - name: Python tests, privacy scan, and release checks
        run: pytest -q
      - name: Shell syntax
        run: |
          bash -n install.sh uninstall.sh scripts/*.sh
          python - <<'PY'
          from pathlib import Path
          import subprocess
          for path in Path("bin").iterdir():
              if not path.is_file():
                  continue
              first = path.open(encoding="utf-8").readline().strip()
              if first in {"#!/usr/bin/env bash", "#!/bin/bash", "#!/usr/bin/bash"}:
                  subprocess.run(["bash", "-n", str(path)], check=True)
          PY
      - name: Build and verify package artifacts
        run: |
          python scripts/build_release.py
          python - <<'PY'
          import hashlib
          import json
          import tarfile
          import zipfile
          from pathlib import Path
          version = json.loads(Path("VERSION.json").read_text())["release"]
          dist = Path("dist")
          assert (dist / f"orchbridge-v{version}.sh").is_file()
          archive = dist / f"orchbridge-v{version}.tar.gz"
          zip_archive = dist / f"orchbridge-v{version}.zip"
          assert archive.is_file()
          assert zip_archive.is_file()
          for row in (dist / "SHA256SUMS.txt").read_text().splitlines():
              digest, name = row.split(maxsplit=1)
              assert hashlib.sha256((dist / name.strip()).read_bytes()).hexdigest() == digest
          with tarfile.open(archive, "r:gz") as bundle:
              names = bundle.getnames()
          assert f"orchbridge-v{version}/install.sh" in names
          assert not any("/.omx/" in name or "/.venv/" in name for name in names)
          with zipfile.ZipFile(zip_archive) as bundle:
              zip_names = bundle.namelist()
          assert f"orchbridge-v{version}/install.sh" in zip_names
          assert not any("/.omx/" in name or "/.venv/" in name for name in zip_names)
          PY

  linux-install-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install system requirement
        run: sudo apt-get update && sudo apt-get install -y tmux
      - name: Build and install standalone artifact in temporary HOME
        run: |
          python -m pip install --disable-pip-version-check -r requirements.txt
          python scripts/build_release.py
          VERSION="$(python -c 'import json; print(json.load(open("VERSION.json"))["release"])')"
          python scripts/smoke_install.py "dist/orchbridge-v${VERSION}.sh"
